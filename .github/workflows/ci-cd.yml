name: BookFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Automated Tests & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: pytest -v

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-scan-push:
    name: Build, Scan & Publish Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercased Image Names
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BACKEND=ghcr.io/${LOWER_OWNER}/bookflow-backend" >> $GITHUB_ENV
          echo "IMAGE_FRONTEND=ghcr.io/${LOWER_OWNER}/bookflow-frontend" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Container Image
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} ./backend

      - name: Build Frontend Container Image
        run: |
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} ./frontend

      - name: Trivy Container Vulnerability Scan (Backend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy Container Vulnerability Scan (Frontend)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          scan-type: 'image'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Images to GHCR
        run: |
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes Cluster
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && secrets.KUBE_CONFIG_DATA != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubectl Context
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy BookFlow via Helm
        run: |
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm upgrade --install bookflow ./helm/bookflow \
            --namespace bookflow \
            --create-namespace \
            --set backend.image=ghcr.io/${LOWER_OWNER}/bookflow-backend \
            --set backend.tag=${{ github.sha }} \
            --set frontend.image=ghcr.io/${LOWER_OWNER}/bookflow-frontend \
            --set frontend.tag=${{ github.sha }}
